name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The app only cleans macOS folders, so there is no Linux or Windows build.
    runs-on: macos-14
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build scripts and the bundler run here; none of them needs the token saved in .git/config.
          persist-credentials: false

      - name: Tag matches the app version
        if: env.IS_TAG == 'true'
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: --target universal-apple-darwin
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: Sam ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: ${{ env.IS_TAG != 'true' }}
          releaseBody: |
            Baixe o `.dmg` em **Assets**, logo abaixo. Funciona no macOS 14 ou superior, em Macs Apple Silicon e Intel.

            O app não tem assinatura da Apple: na primeira vez, libere em Ajustes → Privacidade e Segurança → Abrir mesmo assim.

            Detalhes no [README](https://github.com/Pedro-B-Siqueira/sam#instalar).
