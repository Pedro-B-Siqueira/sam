[package]
name = "sam"
version = "0.1.1"
description = "Limpeza de disco para quem programa no macOS"
license = "MIT"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "sam_lib"
path = "src/lib.rs"

[[bin]]
name = "sam"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
libc = "0.2"
trash = "5"
jwalk = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
